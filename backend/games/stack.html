<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ӿ Stack</title>
<style>
  :root{--bg:#0a1420;--bg2:#0e1c2e;--ink:#eaf1f8;--dim:#8298b0;--nano:#4a90e2;--nano2:#7bb8f0;--gold:#ffd23f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
  #hud{display:flex;align-items:center;gap:16px;font-weight:700;letter-spacing:.02em}
  #hud .s{color:var(--nano)} #hud .b{color:var(--dim);font-weight:600}
  #hud .t{font-weight:800;font-size:17px;background:linear-gradient(120deg,var(--nano),var(--nano2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #mute{cursor:pointer;color:var(--dim);font-size:16px;background:none;border:0;padding:2px 4px}
  #stage{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 10px 40px #0008;background:var(--bg2)}
  canvas{display:block;touch-action:none}
  #combo{position:absolute;top:8px;right:10px;font-weight:800;font-size:15px;color:var(--gold);opacity:0;
    transition:opacity .15s;text-shadow:0 1px 6px #000}
  #tgt{position:absolute;top:8px;left:10px;font-weight:700;font-size:12.5px;color:var(--dim)}
  #over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;background:#0a1420ee;text-align:center;padding:18px}
  #over.show{display:flex}
  #over h2{margin:0;font-size:26px;font-weight:800;letter-spacing:.04em}
  #over .sc{font-size:15px;color:var(--dim)} #over .sc b{color:var(--nano)}
  #over .win{color:var(--gold)}
  #over button{margin-top:8px;border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:800;
    background:linear-gradient(120deg,var(--nano),var(--nano2));color:#04121f;cursor:pointer}
  #hint{color:var(--dim);font-size:12px;text-align:center;max-width:22em}
</style></head>
<body><div id="wrap">
  <div id="hud"><span class="t">Ӿ Stack</span><span>Score <span class="s" id="score">0</span></span>
    <span class="b">Best <span id="best">0</span></span><button id="mute" aria-label="Sound">🔊</button></div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="tgt"></div><div id="combo"></div>
    <div id="over"><h2 id="ovh">GAME OVER</h2><div class="sc">Height <b id="ate">0</b></div>
      <div class="sc">Best <b id="best2">0</b></div><button id="again">Play again ▶</button></div>
  </div>
  <div id="hint">Tap, click, or press <b>space</b> to drop the block. Land it clean for a <b style="color:var(--gold)">₿ combo</b>.</div>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const cv=$('c'), ctx=cv.getContext('2d');
  const scoreEl=$('score'), bestEl=$('best'), overEl=$('over'), ateEl=$('ate'), best2El=$('best2'),
        ovhEl=$('ovh'), comboEl=$('combo'), tgtEl=$('tgt'), muteEl=$('mute');
  const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
            set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  // Challenge target: the host WebView injects window.__target (loadHtmlString has no URL query).
  const target = Math.max(0,(window.__target|0)||parseInt(new URLSearchParams(location.search).get('target')||'0',10)||0);

  const BH=26;                 // block height (px)
  let W,H,dpr,best,muted;
  let blocks,mover,dir,speed,score,camY,camTo,dead,ended,chips,shake;

  // ---- sound ----
  let ac; function beep(f,d,t){ if(muted)return; try{ ac=ac||new (window.AudioContext||webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(); o.type=t||'square'; o.frequency.value=f;
    o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.05,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d); o.start(); o.stop(ac.currentTime+d);}catch(e){} }

  function fit(){
    const max=Math.min(window.innerWidth-24, window.innerHeight-160, 460);
    W=Math.floor(max); H=Math.floor(Math.min(max*1.25, window.innerHeight-150));
    dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  const topScreenY=()=>Math.round(H*0.32);   // where the freshly-placed top block sits

  function reset(){
    fit();
    const w0=Math.round(W*0.56), x0=Math.round((W-w0)/2);
    blocks=[{x:x0,w:w0,hue:205}];            // base
    score=0; speed=Math.max(1.7,W/150); dir=1; dead=false; ended=false; chips=[]; shake=0;
    camY=0; camTo=0;
    spawnMover();
    scoreEl.textContent=0; overEl.classList.remove('show'); comboEl.style.opacity=0;
    tgtEl.textContent = target? ('🎯 beat '+target) : '';
    loop();
  }
  function spawnMover(){
    const top=blocks[blocks.length-1];
    // slide in from alternating sides, riding one row above the current top
    dir = (blocks.length%2)? 1 : -1;
    mover={ x: dir>0? -top.w : W, w: top.w, hue:(205+blocks.length*9)%360 };
  }

  function drop(){
    if(dead||ended) return;
    const below=blocks[blocks.length-1];
    const L=Math.max(mover.x,below.x), R=Math.min(mover.x+mover.w, below.x+below.w);
    const overlap=R-L;
    if(overlap<=0){ return gameOver(false); }         // missed entirely
    const perfect=Math.abs(mover.x-below.x)<5;
    let nx=L, nw=overlap;
    if(perfect){ nx=below.x; nw=below.w; combo(); beep(880,.09,'sine'); }   // clean land: keep full width
    else{
      // slice the overhang -> a falling chip
      comboReset();
      if(mover.x<below.x) chips.push({x:mover.x,w:below.x-mover.x,y:topScreenY(),hue:mover.hue,vy:0,vx:-1.5});
      else if(mover.x+mover.w>below.x+below.w) chips.push({x:R,w:(mover.x+mover.w)-R,y:topScreenY(),hue:mover.hue,vy:0,vx:1.5});
      beep(300,.07,'square'); shake=4;
    }
    blocks.push({x:nx,w:nw,hue:mover.hue});
    score++; scoreEl.textContent=score;
    camTo += BH;                                       // pan the camera up one row
    speed=Math.min(9, speed+0.11);
    if(target && score>=target && !ended){ return gameOver(true); }
    spawnMover();
  }

  let comboN=0;
  function combo(){ comboN++; if(comboN>1){ comboEl.textContent='₿ x'+comboN; comboEl.style.opacity=1;
    clearTimeout(comboEl._t); comboEl._t=setTimeout(()=>comboEl.style.opacity=0,700);
    score+=comboN; scoreEl.textContent=score; } }
  function comboReset(){ comboN=0; }

  function loop(){
    if(dead) return;
    // move the block
    mover.x += dir*speed;
    const below=blocks[blocks.length-1];
    if(mover.x<-mover.w+2){ mover.x=-mover.w+2; dir=1; }
    if(mover.x>W-2){ mover.x=W-2; dir=-1; }
    // camera easing
    camY += (camTo-camY)*0.2;
    // chips physics
    for(const c of chips){ c.vy+=0.6; c.y+=c.vy; c.x+=c.vx; }
    chips=chips.filter(c=>c.y<H+40);
    if(shake>0) shake*=0.8;
    draw();
    requestAnimationFrame(loop);
  }

  function blockY(i){ // screen y of block index i (0=base), given camera
    const topIdx=blocks.length-1;
    return topScreenY() + (topIdx-i)*BH + (camTo-camY);
  }
  function rr(x,y,w,h,r){ ctx.beginPath(); r=Math.min(r,h/2,w/2);
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function paint(x,y,w,hue,glow){
    const g=ctx.createLinearGradient(x,y,x+w,y+BH);
    g.addColorStop(0,'hsl('+hue+',62%,58%)'); g.addColorStop(1,'hsl('+((hue+24)%360)+',66%,46%)');
    ctx.fillStyle=g; rr(x,y,w,BH-3,6); ctx.fill();
    if(glow){ ctx.save(); ctx.globalAlpha=.6; ctx.strokeStyle='#ffd23f'; ctx.lineWidth=2; rr(x,y,w,BH-3,6); ctx.stroke(); ctx.restore(); }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const sx=(shake>0.4)?(Math.random()-.5)*shake:0; ctx.save(); ctx.translate(sx,0);
    // stacked blocks (skip those scrolled off)
    for(let i=0;i<blocks.length;i++){ const b=blocks[i], y=blockY(i);
      if(y>H+BH||y<-BH) continue; paint(b.x,y,b.w,b.hue, i===blocks.length-1); }
    // falling chips
    for(const c of chips) paint(c.x,c.y,c.w,c.hue,false);
    // the moving block, one row above the top
    if(!ended){ const my=topScreenY()-BH+(camTo-camY); paint(mover.x,my,mover.w,mover.hue,false); }
    ctx.restore();
  }

  function gameOver(win){
    if(ended) return; ended=true; dead=true;
    beep(win?660:150,.25,win?'sine':'sawtooth');
    if(score>best){ best=score; LS.set('xStackBest',best); }
    bestEl.textContent=best; best2El.textContent=best; ateEl.textContent=score;
    ovhEl.textContent=win?'CHALLENGE WON':'GAME OVER'; ovhEl.className=win?'win':'';
    overEl.classList.add('show');
    const payload={type:'xc-game-score',game:'stack',score:score,target:target,beat:target?score>=target:null};
    try{ if(window.XCScore) XCScore.postMessage(JSON.stringify(payload)); }catch(e){}
    try{ window.parent.postMessage(payload,'*'); }catch(e){}
  }

  // ---- input ----
  function tap(e){ if(e){ e.preventDefault(); } if(ended){ return; } drop(); }
  $('stage').addEventListener('pointerdown',tap,{passive:false});
  window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp'||e.key===' '){ e.preventDefault(); if(!ended) drop(); }});
  $('again').addEventListener('click',e=>{ e.stopPropagation(); reset(); });
  muteEl.addEventListener('click',e=>{ e.stopPropagation(); muted=!muted; LS.set('xMute',muted); muteEl.textContent=muted?'🔇':'🔊'; });
  window.addEventListener('resize',()=>{ if(!dead) fit(); });

  best=LS.get('xStackBest',0); bestEl.textContent=best;
  muted=LS.get('xMute',false); muteEl.textContent=muted?'🔇':'🔊';
  try{ document.body.tabIndex=0; window.focus(); document.body.focus(); }catch(e){}
  reset();
})();
</script>
</body></html>
